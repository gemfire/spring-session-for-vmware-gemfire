plugins {
  id 'groovy-gradle-plugin'
}

repositories {
  def repositoryConfigFilePath = providers.gradleProperty("spring.gemfire.repositories").getOrElse(
    providers.environmentVariable("HOME").get() + "/.gradle/gradleRepositories.json"
  )
  def jsonString = new File(repositoryConfigFilePath).text
  def repositories = new groovy.json.JsonSlurper().parseText(jsonString)
  repositories.repositories.each { entry ->
    maven {
      url entry.url
      if (entry.username) {
        credentials {
          username entry.username
          password entry.password
        }
      }
    }
  }
  if (providers.gradleProperty("useMavenCentral").getOrElse("false").toBoolean()) {
    mavenCentral()
  }
}

dependencies {
  implementation(gradleApi())

  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
  useJUnitPlatform()
}

group = 'org.apache.geode.gradle'
version = 1.0

gradlePlugin {
  plugins.register('gemfire-server-integration-test-plugin') {
    id = 'gemfire-server'
    implementationClass = 'build.GemFireServerPlugin'
  }
}
